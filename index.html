<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Grand Palace - Table Booking & Location</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: space-between;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 300px;
        }

        .section h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        /* Booking Form Styles */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            background-color: #e74c3c;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #c0392b;
        }

        /* Map Styles */
        .map-container {
            width: 100%;
            height: 350px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Success Message */
        #success-msg {
            margin-top: 15px;
            color: #27ae60;
            font-weight: bold;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Hotel Grand Palace</h1>
        <p>Swagat hai! Ghar baithe table book karein aur hamari location track karein.</p>
    </header>

    <div class="container">
        
        <!-- Table Booking Section -->
        <div class="section">
            <h2>Table Booking Karein</h2>
            <form id="bookingForm" onsubmit="handleBooking(event)">
                <div class="form-group">
                    <label for="name">Aapka Naam:</label>
                    <input type="text" id="name" required placeholder="Apna pura naam likhein">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" required placeholder="Mobile number likhein">
                </div>
                <div class="form-group">
                    <label for="guests">Kitne Log Hain (Guests):</label>
                    <select id="guests">
                        <option value="1">1 Person</option>
                        <option value="2">2 People</option>
                        <option value="4">4 People</option>
                        <option value="6">6 People</option>
                        <option value="10">10+ People (Party)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Tarikh (Date):</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Samay (Time):</label>
                    <input type="time" id="time" required>
                </div>
                <button type="submit" class="btn">Table Book Karein</button>
            </form>
            <div id="success-msg"></div>
        </div>

        <!-- Location Track Section -->
        <div class="section">
            <h2>Hotel Ki Location Dekhein</h2>
            <p style="margin-bottom: 15px; font-size: 14px; color: #555;">Aap yahan se hamara pata dekh sakte hain aur Google Maps par navigate kar sakte hain.</p>
            <div class="map-container">
                <!-- Google Map Embed (Aap yahan apne hotel ka address ka iframe laga sakte hain) -->
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3506.103099955365!2d77.2090!3d28.6139!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjjCsDM2JzUwLjQiTiA3N8KwMTInMzIuNCJF!5e0!3m2!1sen!2sin!4f1625000000000!5m2!1sen!2sin" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; 2026 Hotel Grand Palace. Sabhi adhikar surakshit hain.</p>
    </footer>

    <script>
        function handleBooking(event) {
            event.preventDefault(); // Page refresh hone se rokne ke liye
            
            const name = document.getElementById('name').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            const msgDiv = document.getElementById('success-msg');
            msgDiv.innerHTML = `Badhai ho ${name}! Aapki table ${date} ko ${time} baje ke liye successfully book ho gayi hai.`;
            
            // Form reset karne ke liye
            document.getElementById('bookingForm').reset();
        }
    </script>

</body>
</html>
